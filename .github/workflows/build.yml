name: Build SilentPatchSA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "main"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with ModUtils submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Patch plugin-sdk RenderWare headers
        shell: pwsh
        run: |
          $d = "rwsdk\include\d3d9"
          $p = Get-Content "$d\rwplcore.h" -Raw
          $p = $p -replace '\*&RwEngineInstance;', '*RwEngineInstance;'
          Set-Content "$d\rwplcore.h" -Value $p -NoNewline
          $a = Get-Content "$d\rtanim.h" -Raw
          $a = $a -replace '#include <rw/rtanim\.rpe>', '#include "rtanim.rpe"'
          $a = $a -replace '//(\s*RwInt32\s+animKeyFrameSize;)', '$1'
          Set-Content "$d\rtanim.h" -Value $a -NoNewline
          if (Select-String -Path "$d\rwplcore.h" -Pattern '\*&RwEngineInstance') { throw "rwplcore.h patch failed" }
          if (Select-String -Path "$d\rtanim.h" -Pattern '<rw/rtanim') { throw "rtanim.h include patch failed" }
          if (-not (Select-String -Path "$d\rtanim.h" -Pattern '^\s*RwInt32\s+animKeyFrameSize;')) { throw "animKeyFrameSize patch failed" }

      - name: Patch SilentPatch source for the v143 toolset
        shell: pwsh
        run: |
          $enc = [Text.Encoding]::GetEncoding(28591)   # byte-for-byte round trip, no re-encoding

          function Edit-Source([string]$Path, [string]$Pattern, [string]$Replacement, [int]$Expected = 1) {
            $full = Join-Path (Get-Location).Path $Path
            $text = [IO.File]::ReadAllText($full, $enc)
            $count = [regex]::Matches($text, $Pattern).Count
            if ($count -ne $Expected) { throw "Patch expected $Expected match(es) but found $count in $Path :: $Pattern" }
            [IO.File]::WriteAllText($full, [regex]::Replace($text, $Pattern, $Replacement), $enc)
          }

          # 1) VehicleSA.h: declare LightbeamFix::SetCurrentVehicle before the template that uses it (/permissive-)
          $vh = Join-Path (Get-Location).Path 'SilentPatchSA\VehicleSA.h'
          $nl = if ([IO.File]::ReadAllText($vh, $enc).Contains("`r`n")) { "`r`n" } else { "`n" }
          $fwd = "class CVehicle;" + $nl + "namespace LightbeamFix { void SetCurrentVehicle( CVehicle* vehicle ); }" + $nl + $nl
          Edit-Source 'SilentPatchSA\VehicleSA.h' '(?m)^(?=class NOVMT CVehicle\s*:\s*public CPhysical)' $fwd

          # 2) SilentPatchSA.cpp: explicit kernel32 signatures instead of decltype() of SDK declarations
          $f = 'SilentPatchSA\SilentPatchSA.cpp'
          Edit-Source $f 'static decltype\(InitializeConditionVariable\)\*
