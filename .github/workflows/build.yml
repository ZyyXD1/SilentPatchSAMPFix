name: Build SilentPatchSA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "main"
      disable_groups:
        description: "Comma list of SilentPatch code to leave alone: list, msaa, videomode, dialog (all = these four), plus muzzle, and the entity/anim/streaming suspects: props, tempobj, rc, replay, stream, heap (suspects = those six). muzzle and suspects are never part of all. Empty = upstream behaviour."
        required: false
        type: string
        default: "all"

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout (with ModUtils submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Patch sources for the v143 toolset and plugin-sdk headers
        shell: python
        env:
          DISABLE_GROUPS: ${{ inputs.disable_groups }}
        run: |
          import os
          import pathlib
          import re
          import sys

          def edit(path, pattern, repl, expected=1):
              p = pathlib.Path(path)
              text = p.read_bytes().decode("latin-1")   # byte-for-byte round trip
              new, n = re.subn(pattern, repl, text, flags=re.M)
              if n != expected:
                  sys.exit(f"PATCH FAILED: expected {expected} match(es), found {n} in {path}: {pattern}")
              p.write_bytes(new.encode("latin-1"))
              print(f"ok ({n}x) {path}: {pattern[:70]}")

          sdk = "rwsdk/include/d3d9"
          vh = "SilentPatchSA/VehicleSA.h"
          cpp = "SilentPatchSA/SilentPatchSA.cpp"

          # --- plugin-sdk RenderWare headers: restore the original SDK form ---
          edit(sdk + "/rwplcore.h", r"\*&RwEngineInstance;", lambda m: "*RwEngineInstance;")
          edit(sdk + "/rtanim.h", r"#include <rw/rtanim\.rpe>", lambda m: '#include "rtanim.rpe"')
          edit(sdk + "/rtanim.h", r"//(\s*RwInt32\s+animKeyFrameSize;)", lambda m: m.group(1))

          # --- VehicleSA.h: declare LightbeamFix::SetCurrentVehicle before the template using it (/permissive-) ---
          nl = "\r\n" if b"\r\n" in pathlib.Path(vh).read_bytes() else "\n"
          fwd = "class CVehicle;" + nl + "namespace LightbeamFix { void SetCurrentVehicle( CVehicle* vehicle ); }" + nl + nl
          edit(vh, r"^(?=class NOVMT CVehicle\s*:\s*public CPhysical)", lambda m: fwd)

          # --- SilentPatchSA.cpp: explicit kernel32 signatures instead of decltype() of SDK declarations ---
          edit(cpp, r"static decltype\(InitializeConditionVariable\)\* pInitializeConditionVariable = nullptr;",
               lambda m: "static void (WINAPI* pInitializeConditionVariable)(CONDITION_VARIABLE*) = nullptr;")
          edit(cpp, r"static decltype\(SleepConditionVariableCS\)\* pSleepConditionVariableCS = nullptr;",
               lambda m: "static BOOL (WINAPI* pSleepConditionVariableCS)(CONDITION_VARIABLE*, CRITICAL_SECTION*, DWORD) = nullptr;")
          edit(cpp, r"static decltype\(WakeConditionVariable\)\* pWakeConditionVariable = nullptr;",
               lambda m: "static void (WINAPI* pWakeConditionVariable)(CONDITION_VARIABLE*) = nullptr;")

          # --- HookEach: in-class static variable templates need 'inline' to be defined (fixes LNK2001) ---
          edit(vh, r"static void \(CVehicle::\*orgDoHeadLightBeam\)\(",
               lambda m: "static inline void (CVehicle::*orgDoHeadLightBeam)(")
          edit(vh, r"static void \(CAutomobile::\*orgAutomobilePreRender\)\(",
               lambda m: "static inline void (CAutomobile::*orgAutomobilePreRender)(")
          edit(vh, r"static void \(CAutomobile::\*orgSpawnFlyingComponent\)\(",
               lambda m: "static inline void (CAutomobile::*orgSpawnFlyingComponent)(")
          edit(vh, r"static CVehicle\* \(CStoredCar::\*orgRestoreCar\)\(",
               lambda m: "static inline CVehicle* (CStoredCar::*orgRestoreCar)(")
          edit(cpp, r"^(\t\t)static void \(\*orgPrintString\)\(",
               lambda m: m.group(1) + "static inline void (*orgPrintString)(", expected=2)
          edit(cpp, r"^(\t\t)static void \(\*orgSetRightJustifyWrap\)\(",
               lambda m: m.group(1) + "static inline void (*orgSetRightJustifyWrap)(")
          edit(cpp, r"^(\t\t)static void \(\*orgWrapFunction\)\(",
               lambda m: m.group(1) + "static inline void (*orgWrapFunction)(")

          # --- SA-MP crash fix: CTimeCycle::Initialise (0x5BBAC0) faults inside sscanf_TimecycLine ---
          # This hook is new since the April build. Disabling it restores April behaviour for timecyc.dat parsing.
          edit(cpp, r"^(\t\t)InterceptCall\(0x5BBCE2, orgSscanf, sscanf_TimecycLine\);",
               lambda m: m.group(1) + "// disabled for SA-MP: InterceptCall(0x5BBCE2, orgSscanf, sscanf_TimecycLine);")

          # --- Diagnostic switches: leave selected SilentPatch display code alone (SA-MP rewrites parts of it) ---
          # DISABLE_GROUPS is a comma list of: list, msaa, videomode, dialog (or "all"). Empty = upstream behaviour.
          raw = os.environ.get("DISABLE_GROUPS", "")
          groups = {g.strip().lower() for g in raw.split(",") if g.strip()}
          if "all" in groups:
              groups = (groups - {"all"}) | {"list", "msaa", "videomode", "dialog"}
          SUSPECTS = {"props", "tempobj", "rc", "replay", "stream", "heap"}
          if "suspects" in groups:
              groups = (groups - {"suspects"}) | SUSPECTS
          unknown = groups - {"list", "msaa", "videomode", "dialog", "muzzle"} - SUSPECTS
          if unknown:
              sys.exit(f"Unknown disable group(s): {sorted(unknown)}")
          print("Disabled groups:", sorted(groups) or "none")

          def comment_out(stmt, after=""):
              # Comment a statement line, optionally requiring a lookahead so only the 1.0 occurrence matches.
              edit(cpp, r"^(\t+)(" + stmt + r")" + after, lambda m: m.group(1) + "// SA-MP safe: " + m.group(2))

          if "list" in groups:   # resolution list edits
              for stmt in (
                  r"Nop\(0x745B71, 6\);", r"Nop\(0x745B81, 6\);", r"Nop\(0x745BFC, 2\);",
                  r"Nop\(0x74596C, 6\);", r"Nop\(0x74597A, 6\);",
                  r"ReadCall\( 0x745B1E, orgGetNumVideoModes \);",
                  r"InjectHook\(0x745B1E, GetNumVideoModes_Store\);",
                  r"InjectHook\(0x745A81, GetNumVideoModes_Retrieve\);",
                  r"InjectHook\(0x7455E0, GetAvailableMemory_Fake, HookType::Jump\);",
              ):
                  comment_out(stmt)

          if "msaa" in groups:   # MSAA menu fixes: unconditional patches and InterceptCall hooks in CMenuManager code
              comment_out(r"Patch<BYTE>\(0x57D126, 0xEB\);")
              comment_out(r"Nop\(0x57D0E8, 2\);")
              comment_out(r"HookEach_GetMaxMultiSamplingLevels\(getMaxMultiSamplingLevels, InterceptCall\);",
                          r"(?=\r?\n\r?\n\t\tstd::array<uintptr_t, 4> setOrChangeMultiSamplingLevels = \{ 0x5744FD)")
              comment_out(r"HookEach_SetOrChangeMultiSamplingLevels\(setOrChangeMultiSamplingLevels, InterceptCall\);",
                          r"(?=\r?\n\r?\n\t\tNop\(0x57A0FC, 1\);)")
              comment_out(r"Nop\(0x57A0FC, 1\);")
              comment_out(r"InjectHook\(0x57A0FD, MSAAText, HookType::Call\);")

          if "videomode" in groups:   # hooks on the calls that apply a new video mode
              comment_out(r"HookEach_SetCurrentVideoMode\(setCurrentVideoMode, InterceptCall\);",
                          r"(?=\r?\n\t\tInterceptCall\(0x745C7D)")
              comment_out(r"InterceptCall\(0x745C7D, orgSetupBackBufferVertex, SetupBackBufferVertex_Nop\);")

          if "dialog" in groups:   # remade monitor/resolution selection dialog (1.0 path)
              edit(cpp, r"^(\t)if \(NewResolutionSelectionDialog::HasGameBindings\(\)\)(?=\r?\n\t\{\r?\n\t\tusing namespace NewResolutionSelectionDialog;\r?\n\r?\n\t\tppRWD3D9 = \*AddressByRegion_10)",
                   lambda m: m.group(1) + "if (false && NewResolutionSelectionDialog::HasGameBindings())")

          if "muzzle" in groups:   # muzzle flash on last bullet: fixed-address patch inside CTaskSimpleUseGun code (1.0 path)
              comment_out(r"Nop\(0x61ECDC, 6\);")
              comment_out(r"Patch\(0x61ECE2, \{ 0x84, 0xC0, 0x74 \}\);")

          def gate(cond):
              # 1.0 path only: the Steam/new-binaries copies of these conditions are followed by ' try'
              edit(cpp, r"^(\t)if \(" + cond + r"\)(?=\r?\n\t\{)",
                   lambda m: m.group(1) + "if (false && " + cond.replace("\\", "") + ")")

          if "props" in groups:    # delayed destruction of held props (0x5E03D4)
              comment_out(r"Patch\(0x5E03D4, \{ 0x81, 0x4E, 0x1C, 0x00, 0x08, 0x00, 0x00, 0xEB, 0x0F \}\);")
          if "heap" in groups:     # 0x5C25D3 heap corruption fix
              comment_out(r"Nop\(0x5C25D3, 5\);")
          if "stream" in groups:   # RtAnimInterpolatorSetCurrentAnim replacement ("streaming memory bug")
              comment_out(r"InjectHook\(0x4C51A9, GTARtAnimInterpolatorSetCurrentAnim\);")
          if "tempobj" in groups:  # CObject::TryToFreeUpTempObjects replacement
              gate(r"HasGameBindings_TryToFreeUpTempObjects\(\)")
          if "rc" in groups:       # FindPlayer wrappers for RC streaming
              gate(r"HasGameBindings_FindPlayer\(\)")
          if "replay" in groups:   # replay PlayerPed crash fixes
              gate(r"ReplayPlayerPedCrashFixes::HasGameBindings\(\)")

          print("All patches applied.")

      - name: Build SilentPatchSA (Release|Win32)
        shell: pwsh
        env:
          RWG36SDK: ${{ github.workspace }}\rwsdk
        run: |
          msbuild SilentPatchSA\SilentPatchSA.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:VcpkgEnableManifest=true `
            /verbosity:minimal

      - name: Collect .asi and .ini
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asi = Get-ChildItem -Recurse -Filter SilentPatchSA.asi | Select-Object -First 1
          if (-not $asi) { throw "SilentPatchSA.asi was not produced" }
          Copy-Item $asi.FullName dist\
          Copy-Item Config\SilentPatchSA.ini dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchSA
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import os
          import shutil
          import subprocess

          number = os.environ["RUN_NUMBER"]
          attempt = os.environ["RUN_ATTEMPT"]
          tag = f"build-{number}" if attempt == "1" else f"build-{number}-r{attempt}"
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          zip_base = f"SilentPatchSA-{tag}"
          shutil.make_archive(zip_base, "zip", "dist")

          notes = (
              f"SilentPatchSA for GTA SA 1.0 / SA-MP, built from repository commit {sha[:7]}.\n\n"
              "Build-time patches: v143 toolset fixes, plugin-sdk RenderWare header fixes, "
              "and the timecycle sscanf hook disabled (startup crash under SA-MP).\n\n"
              "Install: put SilentPatchSA.asi and SilentPatchSA.ini in your GTA San Andreas folder, "
              "replacing any older SilentPatch files."
          )

          cmd = [
              "gh", "release", "create", tag,
              f"{zip_base}.zip", "dist/SilentPatchSA.asi", "dist/SilentPatchSA.ini",
              "--repo", os.environ["REPO"],
              "--target", sha,
              "--title", f"SilentPatchSA SA-MP build #{number}",
              "--notes", notes,
          ]
          print("Creating release", tag, "from", sha)
          subprocess.run(cmd, check=True)
