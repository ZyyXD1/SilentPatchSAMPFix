name: Build SilentPatchSA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "main"
      sa_mp_resolution_safe:
        description: "Leave the resolution-list code alone (SA-MP rewrites it). Diagnostic for the resolution bug."
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout (with ModUtils submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Patch sources for the v143 toolset and plugin-sdk headers
        shell: python
        env:
          SAFE_RES: ${{ inputs.sa_mp_resolution_safe }}
        run: |
          import os
          import pathlib
          import re
          import sys

          def edit(path, pattern, repl, expected=1):
              p = pathlib.Path(path)
              text = p.read_bytes().decode("latin-1")   # byte-for-byte round trip
              new, n = re.subn(pattern, repl, text, flags=re.M)
              if n != expected:
                  sys.exit(f"PATCH FAILED: expected {expected} match(es), found {n} in {path}: {pattern}")
              p.write_bytes(new.encode("latin-1"))
              print(f"ok ({n}x) {path}: {pattern[:70]}")

          sdk = "rwsdk/include/d3d9"
          vh = "SilentPatchSA/VehicleSA.h"
          cpp = "SilentPatchSA/SilentPatchSA.cpp"

          # --- plugin-sdk RenderWare headers: restore the original SDK form ---
          edit(sdk + "/rwplcore.h", r"\*&RwEngineInstance;", lambda m: "*RwEngineInstance;")
          edit(sdk + "/rtanim.h", r"#include <rw/rtanim\.rpe>", lambda m: '#include "rtanim.rpe"')
          edit(sdk + "/rtanim.h", r"//(\s*RwInt32\s+animKeyFrameSize;)", lambda m: m.group(1))

          # --- VehicleSA.h: declare LightbeamFix::SetCurrentVehicle before the template using it (/permissive-) ---
          nl = "\r\n" if b"\r\n" in pathlib.Path(vh).read_bytes() else "\n"
          fwd = "class CVehicle;" + nl + "namespace LightbeamFix { void SetCurrentVehicle( CVehicle* vehicle ); }" + nl + nl
          edit(vh, r"^(?=class NOVMT CVehicle\s*:\s*public CPhysical)", lambda m: fwd)

          # --- SilentPatchSA.cpp: explicit kernel32 signatures instead of decltype() of SDK declarations ---
          edit(cpp, r"static decltype\(InitializeConditionVariable\)\* pInitializeConditionVariable = nullptr;",
               lambda m: "static void (WINAPI* pInitializeConditionVariable)(CONDITION_VARIABLE*) = nullptr;")
          edit(cpp, r"static decltype\(SleepConditionVariableCS\)\* pSleepConditionVariableCS = nullptr;",
               lambda m: "static BOOL (WINAPI* pSleepConditionVariableCS)(CONDITION_VARIABLE*, CRITICAL_SECTION*, DWORD) = nullptr;")
          edit(cpp, r"static decltype\(WakeConditionVariable\)\* pWakeConditionVariable = nullptr;",
               lambda m: "static void (WINAPI* pWakeConditionVariable)(CONDITION_VARIABLE*) = nullptr;")

          # --- HookEach: in-class static variable templates need 'inline' to be defined (fixes LNK2001) ---
          edit(vh, r"static void \(CVehicle::\*orgDoHeadLightBeam\)\(",
               lambda m: "static inline void (CVehicle::*orgDoHeadLightBeam)(")
          edit(vh, r"static void \(CAutomobile::\*orgAutomobilePreRender\)\(",
               lambda m: "static inline void (CAutomobile::*orgAutomobilePreRender)(")
          edit(vh, r"static void \(CAutomobile::\*orgSpawnFlyingComponent\)\(",
               lambda m: "static inline void (CAutomobile::*orgSpawnFlyingComponent)(")
          edit(vh, r"static CVehicle\* \(CStoredCar::\*orgRestoreCar\)\(",
               lambda m: "static inline CVehicle* (CStoredCar::*orgRestoreCar)(")
          edit(cpp, r"^(\t\t)static void \(\*orgPrintString\)\(",
               lambda m: m.group(1) + "static inline void (*orgPrintString)(", expected=2)
          edit(cpp, r"^(\t\t)static void \(\*orgSetRightJustifyWrap\)\(",
               lambda m: m.group(1) + "static inline void (*orgSetRightJustifyWrap)(")
          edit(cpp, r"^(\t\t)static void \(\*orgWrapFunction\)\(",
               lambda m: m.group(1) + "static inline void (*orgWrapFunction)(")

          # --- SA-MP crash fix: CTimeCycle::Initialise (0x5BBAC0) faults inside sscanf_TimecycLine ---
          # This hook is new since the April build. Disabling it restores April behaviour for timecyc.dat parsing.
          edit(cpp, r"^(\t\t)InterceptCall\(0x5BBCE2, orgSscanf, sscanf_TimecycLine\);",
               lambda m: m.group(1) + "// disabled for SA-MP: InterceptCall(0x5BBCE2, orgSscanf, sscanf_TimecycLine);")

          # --- Diagnostic: leave the resolution-list code alone (SA-MP rewrites this block) ---
          # Comments out SilentPatch's edits around 0x7455E0-0x745C00 and 0x74596C-0x7459D0 in the 1.0 path.
          if os.environ.get("SAFE_RES", "true").lower() == "true":
              for stmt in (
                  r"Nop\(0x745B71, 6\);", r"Nop\(0x745B81, 6\);", r"Nop\(0x745BFC, 2\);",
                  r"Nop\(0x74596C, 6\);", r"Nop\(0x74597A, 6\);",
                  r"ReadCall\( 0x745B1E, orgGetNumVideoModes \);",
                  r"InjectHook\(0x745B1E, GetNumVideoModes_Store\);",
                  r"InjectHook\(0x745A81, GetNumVideoModes_Retrieve\);",
                  r"InjectHook\(0x7455E0, GetAvailableMemory_Fake, HookType::Jump\);",
              ):
                  edit(cpp, r"^(\t+)(" + stmt + r")", lambda m: m.group(1) + "// SA-MP safe: " + m.group(2))
          else:
              print("SAFE_RES is off: resolution-list code left as upstream")

          print("All patches applied.")

      - name: Build SilentPatchSA (Release|Win32)
        shell: pwsh
        env:
          RWG36SDK: ${{ github.workspace }}\rwsdk
        run: |
          msbuild SilentPatchSA\SilentPatchSA.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:VcpkgEnableManifest=true `
            /verbosity:minimal

      - name: Collect .asi and .ini
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asi = Get-ChildItem -Recurse -Filter SilentPatchSA.asi | Select-Object -First 1
          if (-not $asi) { throw "SilentPatchSA.asi was not produced" }
          Copy-Item $asi.FullName dist\
          Copy-Item Config\SilentPatchSA.ini dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchSA
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import os
          import shutil
          import subprocess

          number = os.environ["RUN_NUMBER"]
          attempt = os.environ["RUN_ATTEMPT"]
          tag = f"build-{number}" if attempt == "1" else f"build-{number}-r{attempt}"
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          zip_base = f"SilentPatchSA-{tag}"
          shutil.make_archive(zip_base, "zip", "dist")

          notes = (
              f"SilentPatchSA for GTA SA 1.0 / SA-MP, built from repository commit {sha[:7]}.\n\n"
              "Build-time patches: v143 toolset fixes, plugin-sdk RenderWare header fixes, "
              "and the timecycle sscanf hook disabled (startup crash under SA-MP).\n\n"
              "Install: put SilentPatchSA.asi and SilentPatchSA.ini in your GTA San Andreas folder, "
              "replacing any older SilentPatch files."
          )

          cmd = [
              "gh", "release", "create", tag,
              f"{zip_base}.zip", "dist/SilentPatchSA.asi", "dist/SilentPatchSA.ini",
              "--repo", os.environ["REPO"],
              "--target", sha,
              "--title", f"SilentPatchSA SA-MP build #{number}",
              "--notes", notes,
          ]
          print("Creating release", tag, "from", sha)
          subprocess.run(cmd, check=True)
