name: Build SilentPatchSA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "main"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with ModUtils submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Patch plugin-sdk RenderWare headers
        shell: pwsh
        run: |
          $d = "rwsdk\include\d3d9"
          $p = Get-Content "$d\rwplcore.h" -Raw
          $p = $p -replace '\*&RwEngineInstance;', '*RwEngineInstance;'
          Set-Content "$d\rwplcore.h" -Value $p -NoNewline
          $a = Get-Content "$d\rtanim.h" -Raw
          $a = $a -replace '#include <rw/rtanim\.rpe>', '#include "rtanim.rpe"'
          $a = $a -replace '//(\s*RwInt32\s+animKeyFrameSize;)', '$1'
          Set-Content "$d\rtanim.h" -Value $a -NoNewline
          if (Select-String -Path "$d\rwplcore.h" -Pattern '\*&RwEngineInstance') { throw "rwplcore.h patch failed" }
          if (Select-String -Path "$d\rtanim.h" -Pattern '<rw/rtanim') { throw "rtanim.h patch failed" }
          if (-not (Select-String -Path "$d\rtanim.h" -Pattern '^\s*RwInt32\s+animKeyFrameSize;')) { throw "animKeyFrameSize patch failed" }

      - name: Patch SilentPatch source for the v143 toolset
        shell: pwsh
        run: |
          $enc = [Text.Encoding]::GetEncoding(28591)   # byte-for-byte round trip, no re-encoding

          function Edit-Source([string]$Path, [string]$Pattern, [string]$Replacement) {
            $full = Join-Path (Get-Location).Path $Path
            $text = [IO.File]::ReadAllText($full, $enc)
            $new = [regex]::Replace($text, $Pattern, $Replacement)
            if ($new -ceq $text) { throw "Patch did not apply: $Path ($Pattern)" }
            [IO.File]::WriteAllText($full, $new, $enc)
          }

          # 1) VehicleSA.h: declare LightbeamFix::SetCurrentVehicle before the template that uses it (/permissive-)
          $vh = Join-Path (Get-Location).Path 'SilentPatchSA\VehicleSA.h'
          $nl = if ([IO.File]::ReadAllText($vh, $enc).Contains("`r`n")) { "`r`n" } else { "`n" }
          $fwd = "class CVehicle;" + $nl + "namespace LightbeamFix { void SetCurrentVehicle( CVehicle* vehicle ); }" + $nl + $nl
          Edit-Source 'SilentPatchSA\VehicleSA.h' '(?m)^(?=class NOVMT CVehicle\s*:\s*public CPhysical)' $fwd

          # 2) SilentPatchSA.cpp: explicit kernel32 signatures instead of decltype() of SDK declarations
          $f = 'SilentPatchSA\SilentPatchSA.cpp'
          Edit-Source $f 'static decltype\(InitializeConditionVariable\)\* pInitializeConditionVariable = nullptr;' 'static void (WINAPI* pInitializeConditionVariable)(CONDITION_VARIABLE*) = nullptr;'
          Edit-Source $f 'static decltype\(SleepConditionVariableCS\)\* pSleepConditionVariableCS = nullptr;' 'static BOOL (WINAPI* pSleepConditionVariableCS)(CONDITION_VARIABLE*, CRITICAL_SECTION*, DWORD) = nullptr;'
          Edit-Source $f 'static decltype\(WakeConditionVariable\)\* pWakeConditionVariable = nullptr;' 'static void (WINAPI* pWakeConditionVariable)(CONDITION_VARIABLE*) = nullptr;'

      - name: Build SilentPatchSA (Release|Win32)
        shell: pwsh
        env:
          RWG36SDK: ${{ github.workspace }}\rwsdk
        run: |
          msbuild SilentPatchSA\SilentPatchSA.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:VcpkgEnableManifest=true `
            /verbosity:minimal

      - name: Collect .asi and .ini
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asi = Get-ChildItem -Recurse -Filter SilentPatchSA.asi | Select-Object -First 1
          if (-not $asi) { throw "SilentPatchSA.asi was not produced" }
          Copy-Item $asi.FullName dist\
          Copy-Item Config\SilentPatchSA.ini dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchSA
          path: dist/
          if-no-files-found: error
